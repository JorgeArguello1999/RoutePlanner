name: route-planner
services:
  web:
    build: .
    # Alternative: use prebuilt image (uncomment image and comment build)
    # image: jorgearguello/route-planner:1.0
    ports:
      - "8003:8003"
    volumes:
      # Persist SQLite DB (instance/routeplanner.db)
      - sqlite_data:/app/instance
    env_file:
      - .env
    environment:
      # These override .env defaults if needed; keep DATABASE_URL empty for SQLite
      - HOST=0.0.0.0
      - PORT=8003
      - FLASK_APP=app.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sqlite_data:
