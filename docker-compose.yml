name: route-planner
services:
  web:
    build: .
    ports:
      - "8003:8003"
    # En dev mantenemos volumen para hot-reload, pero excluimos .venv del container
    volumes:
      - .:/app
      - /app/.venv
      - /app/__pycache__
    environment:
      - FLASK_ENV=development
      - DEBUG=True
      - HOST=0.0.0.0
      - PORT=8003
      - FLASK_APP=app.py
      # MySQL: usar pymysql driver (usa mismas vars que el servicio db)
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-route_user}:${MYSQL_PASSWORD:-route_password}@db:3306/${MYSQL_DATABASE:-routeplanner}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0A1glB0r_8tPpo8k9eeWZW3TXvkvCPpw1ZgBmsV5D6s=}
      - CONFIG_ACCESS_KEY=${CONFIG_ACCESS_KEY:-admin}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@routeplanner.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin123!}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-routeplanner}
      - MYSQL_USER=${MYSQL_USER:-route_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-route_password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${MYSQL_USER:-route_user}", "-p${MYSQL_PASSWORD:-route_password}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
