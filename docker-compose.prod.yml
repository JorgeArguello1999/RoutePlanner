# Production - single image (SQLite by default)
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# For external MySQL/PostgreSQL set DATABASE_URL in .env (drivers included)
name: route-planner-prod
services:
  web:
    build: .
    # For prebuilt image use:
    # image: jorgearguello/route-planner:1.0
    ports:
      - "8003:8003"
    volumes:
      - sqlite_data:/app/instance
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8003
      - FLASK_ENV=production
      - DEBUG=False
      - FLASK_APP=app.py
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sqlite_data:
